<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Contact us illustration">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
            <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.25" />
        </linearGradient>
        <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#0d9488" />
        </linearGradient>
    </defs>

    <rect width="800" height="900" fill="#0f172a" />
    <rect width="800" height="900" fill="url(#bg)" />

    <circle cx="120" cy="140" r="180" fill="#ffffff" opacity="0.04" />
    <circle cx="700" cy="780" r="220" fill="#ffffff" opacity="0.04" />

    <g transform="translate(200,300)">
        <rect x="0" y="0" width="400" height="260" rx="28" fill="url(#card)" opacity="0.9" />
        <circle cx="60" cy="60" r="34" fill="#ffffff" opacity="0.9" />
        <rect x="112" y="40" width="220" height="16" rx="8" fill="#ffffff" opacity="0.85" />
        <rect x="112" y="68" width="160" height="12" rx="6" fill="#ffffff" opacity="0.6" />
        <rect x="30" y="130" width="340" height="12" rx="6" fill="#ffffff" opacity="0.5" />
        <rect x="30" y="156" width="340" height="12" rx="6" fill="#ffffff" opacity="0.5" />
        <rect x="30" y="182" width="220" height="12" rx="6" fill="#ffffff" opacity="0.5" />
        <rect x="30" y="216" width="130" height="30" rx="15" fill="#ffffff" opacity="0.9" />
    </g>

    <g transform="translate(150,600)" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity="0.7">
        <path d="M0 40 C 40 -10, 90 -10, 130 40" />
